name: torneo

# Torneo de todos los bots (los del registro y los de bots/) y su clasificación.
# Se lanza al fusionar cambios en los bots, cada lunes, o a mano desde la pestaña Actions
# (con el número de partidas por cruce que se quiera). La clasificación aparece en el resumen
# de la ejecución y se puede descargar en JSON y Markdown.

on:
  workflow_dispatch:
    inputs:
      partidas:
        description: Partidas por cruce
        default: "100"
  push:
    branches: [main]
    paths: ["src/**", "bots/**"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  torneo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar el paquete
        run: pip install -e .
      - name: Jugar el torneo
        run: >
          mus-torneo -n ${{ github.event.inputs.partidas || '100' }} -p 0
          --markdown clasificacion.md --json clasificacion.json
      - name: Publicar la clasificación en el resumen
        run: cat clasificacion.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clasificacion
          path: |
            clasificacion.md
            clasificacion.json
