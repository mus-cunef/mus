name: tests

on:
  pull_request:
  push:
    branches: [main]

# Solo lee el repositorio: ejecuta el código de la PR (también bots de otros equipos).
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar el paquete
        run: pip install -e ".[dev,web]"
      - name: Lint (ruff)
        run: ruff check .
      # -rs: lista los tests omitidos y por qué (aquí, los del navegador y los de PyTorch, que
      # se pasan en los trabajos de abajo).
      - name: Tests (pytest)
        run: pytest -rs

  # Los tests de la web en un Chrome de verdad (los ejecutores de GitHub ya traen Chrome).
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar el paquete
        run: pip install -e ".[dev,web,e2e]"
      - name: Tests en el navegador
        env:
          MUS_EXIGIR_NAVEGADOR: "1"
        run: pytest -rs tests/test_web_navegador.py

  # El entrenamiento (imitación y refuerzo) con PyTorch de CPU.
  entrenamiento:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar el paquete y PyTorch de CPU
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,web,ia]"
      - name: Tests del entrenamiento
        run: pytest -rs tests/test_ia.py tests/test_grabacion.py tests/test_archivo.py
