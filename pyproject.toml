[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musarena"
version = "0.1.0"
description = "Motor del mus de 4 jugadores por parejas, con API para bots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mus Arena (CUNEF)" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27"]
# Solo para entrenar el bot inteligente (para jugar con él basta numpy).
ia = ["torch>=2.2"]
# La interfaz web (mus-web). SQLAlchemy y psycopg: cuentas y torneos privados (SQLite en local,
# PostgreSQL en internet).
web = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
# Pruebas de la web en un navegador de verdad (usa el Chrome instalado).
e2e = ["playwright>=1.40"]
# La documentación online (mkdocs serve / mkdocs build). MkDocs 2 rompe los plugins: se fija la 1.x.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26",
        "mdx_truly_sane_lists>=1.3"]

[project.scripts]
mus-play = "musarena.cli:main"
mus-arena = "musarena.arena:main"
mus-torneo = "musarena.torneo:main"
mus-web = "musarena.web.servidor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Los pesos entrenados del bot inteligente y la tabla medida de descartes viajan con el paquete.
musarena = ["ia/modelos/*.npz", "estrategia/*.npz", "web/estaticos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
