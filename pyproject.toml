[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musarena"
version = "0.1.0"
description = "Motor del mus de 4 jugadores por parejas, con API para bots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mus Arena (CUNEF)" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# Solo para entrenar el bot inteligente (para jugar con él basta numpy).
ia = ["torch>=2.2"]

[project.scripts]
mus-play = "musarena.cli:main"
mus-arena = "musarena.arena:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Los pesos entrenados del bot inteligente viajan con el paquete.
musarena = ["ia/modelos/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
